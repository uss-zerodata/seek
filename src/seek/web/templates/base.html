<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}seek{% endblock %} · seek</title>
<link rel="stylesheet" href="/static/app.css?v={{ V }}">
<script src="/static/app.js?v={{ V }}" defer></script>
<script type="module" src="/static/js/viewer.js?v={{ V }}"></script>
<script type="module" src="/static/js/search.js?v={{ V }}"></script>
</head>
<body>
<header class="bar">
  <a class="brand" href="/">seek</a>
  <nav id="tabs">
    {% for id, label in TABS %}<a href="/v/{{ id }}" data-tab="{{ id }}" {% if nav == id %}aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}
    <a href="/" data-tab="gallery" {% if nav == "gallery" %}aria-current="page"{% endif %}>Screenshots</a>
  </nav>
  <span id="status" class="status" aria-live="polite"></span>
  <button type="button" id="vulndb" class="vulndb dim" title="the vulnerability database - A updates it">◈ vulndb</button>
  <form class="global-search" action="/search" method="get" role="search">
    <input id="global-q" name="q" type="search" autocomplete="off" value="{{ q if nav == '' and q is defined else '' }}"
           placeholder="Search everything  (Ctrl+K)" aria-label="search everything"
           aria-controls="global-results">
    <button type="button" class="syntax-help" data-for="global-q" title="how to search" aria-label="how to search">?</button>
    <div id="global-results" class="global-results" hidden></div>
  </form>
</header>
{% include "_syntax.html" %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
