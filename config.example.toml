# seek configuration - every key shown at its default value.
# Install a copy at the right path with `seek --init-config`, then edit
# that file (its path is `seek --config-path`). Editing THIS example does
# nothing - the app reads the installed copy, not this template.

debounce_ms = 150  # idle ms after the last keystroke before re-searching
min_content_query = 2  # min positive-term length before content search runs
preview_size_cap = 5242880  # bytes; larger files are truncated in the side preview
detail_size_cap = 5242880  # bytes; larger files are truncated in the detail view
content_size_cap = 5242880  # bytes; at most this much of any one file is content-searched
preview_window_lines = 200  # lines shown in the side preview window
max_results = 500  # max rows kept in the result list (rest shown as '+N more')
publish_interval_ms = 500  # min ms between streamed partial-result updates (0 = every batch)
format_content = true  # re-indent over-long structured files before indexing them
format_min_line = 500  # chars; a file is only reformatted if some line exceeds this
content_cache_budget = 536870912  # bytes of decoded file content kept in memory
honor_gitignore = false  # apply .gitignore / .ignore rules while walking
apply_noise_excludes = true  # prune noise_dirs (.git is always pruned)
absolute_output = false  # emit absolute paths instead of root-relative ones
wrap_results = false  # wrap long result rows instead of shortening them to one line
default_editor = "nvim"  # which [editors] entry the editor action uses
nmap_path = "nmap"  # the nmap program to run (looked up on PATH when not a path)
scan_output_dir = ""  # where scans write; empty means the directory the viewer was opened on
gowitness_mode = "auto"  # how to run gowitness: auto (docker, then native), docker, or native
gowitness_path = "gowitness"  # the gowitness program to run, for the native backend
gowitness_image = "ghcr.io/sensepost/gowitness"  # the container image to run, for the docker backend
gowitness_report_host = "127.0.0.1"  # address the gowitness report server binds to
gowitness_report_port = 7171  # port the gowitness report server listens on
gowitness_chrome_path = ""  # a Chrome binary for gowitness to use; empty lets it fetch its own
exclude_globs = []  # extra globs pruned from the walk
noise_dirs = ["node_modules", ".venv", "__pycache__", "target", "dist"]  # directory names pruned unless apply_noise_excludes is false
format_extensions = ["json", "jsonl", "yaml", "yml", "xml", "html", "htm", "svg", "css", "js"]  # file extensions considered for re-indenting

[editors]  # name = command template, with {file} and {line}
nvim = "nvim +{line} {file}"
vim = "vim +{line} {file}"
code = "code --goto {file}:{line}"
emacs = "emacs +{line} {file}"
hx = "hx {file}:{line}"

[keys]  # action = key (Textual key names)
open_default = "ctrl+o"
open_editor = "ctrl+e"
open_code = "ctrl+b"
copy = "ctrl+y"
export = "ctrl+x"
goto_dir = "alt+c"
action_menu = "ctrl+k"
toggle_file = "ctrl+f"
toggle_dir = "ctrl+underscore"
toggle_content = "ctrl+t"
toggle_format = "ctrl+n"
reroot = "ctrl+r"
breadcrumb_pop = "alt+left"
refresh = "ctrl+g"
history_prev = "alt+up"
history_next = "alt+down"
mark = "tab"
clear_marks = "shift+tab"
help = "question_mark"

# Scan presets: a name you pick from, and the nmap arguments it stands
# for. Defining any replaces this whole table, so your list is exactly
# what the app offers. Whether a preset needs root is worked out from
# its flags - do not declare it. The output flags, the targets and any
# elevation are added for you, so leave out -iL, -oA/-oX and sudo.
# `{ports}` expands to the open ports already in the model - the step
# you would otherwise grep out of the previous scan's .gnmap.
[nmap_presets]
"00 · Lookup, DNS names (reverse lookup)" = "-vv -T4 -sL -R"
"00 · Lookup, DNS names (forward lookup)" = "-vv -T4 -sL"

"01 · Discovery, null scan (ICMP/TCP/UDP filtered)" = "-vv -T4 -n -sn -sN"
"01 · Discovery, common ports (ICMP/TCP/UDP) " = "-vv -T4 -n -sn -PE -PP -PS22,80,445 -PA80 -PU53,123,161,500,31347"
"01 · Discovery, top ports (TCP/UDP)" = "-vv -T4 -n -Pn --open -PS20,21,22,23,25,53,67,68,69,80,110,111,123,135,137,138,139,143,161,162,443,445,500,514,520,631,993,995,1434,1723,1900,3306,3389,4500,5900,8080,49152 -PU20,21,22,23,25,53,67,68,69,80,110,111,123,135,137,138,139,143,161,162,443,445,500,514,520,631,993,995,1434,1723,1900,3306,3389,4500,5900,8080,49152"
"01 · Discovery, DNS servers (UDP 53)" = "-vv -T4 -n -Pn -sU -p53"

"02 · Services, top 100 TCP (fast)" = "-vv -T4 -n -Pn -sS --top-ports 100 --defeat-rst-ratelimit"
"02 · Services, top 1000 TCP" = "-vv -T4 -n -Pn -sS --top-ports 1000 --host-timeout 1h"

"03 · Details, versions on known ports" = "-vv -T4 -n -Pn -sS -A --host-timeout 1h -p{ports}"
"03 · Details, full TCP (-p-)" = "-vv -T4 -n -Pn -sS -A -p- --host-timeout 3h"

"04 · Vuln, SMB shares (edit the credentials first)" = "-vv -T4 -n -Pn -p139,445 --script smb-enum-shares --script-args smbuser=USERNAME,smbpass=PASSWORD"
"04 · Vuln, SMB vulnerabilities (139, 445)" = "-vv -T4 -n -Pn -p139,445 --script smb-vuln*"
"04 · Vuln, SSH vulnerabilities (22)" = "-vv -T4 -n -Pn -p22 --script sshv1,ssh2-enum-algos,ssh-hostkey"
"04 · Vuln, HTTP vulnerabilities (80, 443)" = "-vv -T4 -n -Pn -p80,443 --script http-vuln*"
"04 · Vuln, general vulnerabilities (all known ports)" = "-vv -T4 -n -Pn -p{ports} --script vuln"

"05 · Names, from service detection (certs, redirects, NTLM)" = "-vv -T4 -Pn -sV -p{ports} --script ssl-cert,http-title,http-headers,rdp-ntlm-info,smb-os-discovery,nbstat,ldap-rootdse,ssl-cert-intaddr"
"05 · Names, from certificates (queries crt.sh)" = "-vv -T4 -Pn -sV -p{ports} --script hostmap-crtsh"
"05 · Names, from virtual hosts (brute force, noisy)" = "-vv -T4 -Pn -p80,443,8080,8443 --script http-vhosts"

[theme]  # style name = Rich/Textual color
match = "bold bright_yellow"
marker_filename = "blue"
marker_dirname = "cyan"
marker_content = "green"
selected = "bright_magenta"
matched_line = "bright_black"
path = "cyan"
basename = "default"
content = "default"
tree_dir = "bold blue"
tree_branch = "bright_black"
