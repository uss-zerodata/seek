# seek configuration - every key shown at its default value.
# Install a copy at the right path with `seek --init-config`, then edit
# that file (its path is `seek --config-path`). Editing THIS example does
# nothing - the app reads the installed copy, not this template.

debounce_ms = 150  # idle ms after the last keystroke before re-searching
min_content_query = 2  # min positive-term length before content search runs
preview_size_cap = 5242880  # bytes; larger files are truncated in the side preview
detail_size_cap = 5242880  # bytes; larger files are truncated in the detail view
content_size_cap = 5242880  # bytes; at most this much of any one file is content-searched
preview_window_lines = 200  # lines shown in the side preview window
max_results = 500  # max rows kept in the result list (rest shown as '+N more')
publish_interval_ms = 500  # min ms between streamed partial-result updates (0 = every batch)
format_content = true  # re-indent over-long structured files before indexing them
format_min_line = 500  # chars; a file is only reformatted if some line exceeds this
content_cache_budget = 536870912  # bytes of decoded file content kept in memory
honor_gitignore = false  # apply .gitignore / .ignore rules while walking
apply_noise_excludes = true  # prune noise_dirs (.git is always pruned)
absolute_output = false  # emit absolute paths instead of root-relative ones
wrap_results = false  # wrap long result rows instead of shortening them to one line
default_editor = "nvim"  # which [editors] entry the editor action uses
nmap_path = "nmap"  # the nmap program to run (looked up on PATH when not a path)
scan_output_dir = ""  # where scans write; empty means the directory the viewer was opened on
gowitness_mode = "auto"  # how to run gowitness: auto (docker, then native), docker, or native
gowitness_path = "gowitness"  # the gowitness program to run, for the native backend
gowitness_image = "ghcr.io/sensepost/gowitness"  # the container image to run, for the docker backend
gowitness_report_host = "127.0.0.1"  # address the gowitness report server binds to
gowitness_report_port = 7171  # port the gowitness report server listens on
web_host = "127.0.0.1"  # address the viewer's web interface binds to (loopback only)
web_port = 7272  # port the viewer's web interface listens on
gowitness_chrome_path = ""  # a Chrome binary for gowitness to use; empty lets it fetch its own
gowitness_collect_all = true  # record network logs, cookies and response bodies too (large)
gowitness_settle_ms = 2000  # screenshot once the page has been still this long (0: fixed 3 s delay)
gowitness_settle_cap_ms = 20000  # ...or after this long, whatever the page is doing
gowitness_settle_delay_s = 1  # wait this many seconds first, so a redirect on load is followed
vulndb_path = ""  # the vulnerability database; empty means vulndb.sqlite3 in the state dir
vulndb_stale_days = 7  # offer an update when the vulnerability database is older than this
notify_url = ""  # ntfy-compatible webhook told when a scan or capture ends; empty: off
notify_progress = false  # also notify at 25, 50 and 75 % done
exclude_globs = []  # extra globs pruned from the walk
noise_dirs = ["node_modules", ".venv", "__pycache__", "target", "dist"]  # directory names pruned unless apply_noise_excludes is false
format_extensions = ["json", "jsonl", "yaml", "yml", "xml", "html", "htm", "svg", "css", "js"]  # file extensions considered for re-indenting

[editors]  # name = command template, with {file} and {line}
nvim = "nvim +{line} {file}"
vim = "vim +{line} {file}"
code = "code --goto {file}:{line}"
emacs = "emacs +{line} {file}"
hx = "hx {file}:{line}"

[keys]  # action = key (Textual key names)
open_default = "ctrl+o"
open_editor = "ctrl+e"
open_code = "ctrl+b"
copy = "ctrl+y"
export = "ctrl+x"
goto_dir = "alt+c"
action_menu = "ctrl+k"
toggle_file = "ctrl+f"
toggle_dir = "ctrl+d"
toggle_content = "ctrl+c"
toggle_format = "ctrl+n"
reroot = "ctrl+r"
breadcrumb_pop = "alt+left"
refresh = "ctrl+g"
history_prev = "alt+up"
history_next = "alt+down"
mark = "tab"
clear_marks = "shift+tab"
help = "question_mark"


[nmap_presets]

# ============================================================
# 00 · LOOKUP
# ============================================================

# Resolve supplied hostnames into IP addresses without doing
# reverse lookups on the resulting addresses.
# Useful for hostname lists; this does not scan any ports.
"00 · Lookup · Forward DNS" = "-v -sL -n --host-timeout 2m"

# Request reverse DNS lookups for every target, including
# targets that would otherwise be considered unresponsive.
# Avoid applying this to enormous ranges unnecessarily.
"00 · Lookup · Reverse DNS" = "-v -sL -R --host-timeout 2m"


# ============================================================
# 01 · HOST DISCOVERY
# ============================================================

# COMPLETE:
# Retains your original broad TCP SYN and UDP discovery port
# lists, plus the original TCP ACK probe on port 80.
# Includes ICMP echo and timestamp discovery.
# The UDP list additionally retains port 31347 from your
# original common-port preset.
# Best coverage across different firewall configurations.
"01 · Discovery · Complete (broad TCP/UDP probes)" = "-v -T3 -n -sn -PE -PP -PS20,21,22,23,25,53,67,68,69,80,110,111,123,135,137,138,139,143,161,162,443,445,500,514,520,631,993,995,1434,1723,1900,3306,3389,4500,5900,8080,49152 -PA80 -PU20,21,22,23,25,53,67,68,69,80,110,111,123,135,137,138,139,143,161,162,443,445,500,514,520,631,993,995,1434,1723,1900,3306,3389,4500,5900,8080,49152,31347 --initial-rtt-timeout 500ms --max-rtt-timeout 3s --host-timeout 2m"

# FAST:
# Retains your original common discovery probes:
# ICMP echo/timestamp, TCP SYN 22/80/445, TCP ACK 80
# and UDP 53/123/161/500/31347.
# Good balance between discovery coverage and scan time.
"01 · Discovery · Fast (original common probes)" = "-v -T4 -n -sn -PE -PP -PS22,80,445 -PA80 -PU53,123,161,500,31347 --initial-rtt-timeout 400ms --max-rtt-timeout 1500ms --host-timeout 45s"

# VERY FAST:
# Keeps all your original common TCP and UDP probe ports.
# Drops ICMP timestamp probing and uses tighter response
# and host-timeout limits.
# Appropriate for initial enumeration of large ranges.
"01 · Discovery · Very fast (original common probes)" = "-v -T4 -n -sn -PE -PS22,80,445 -PA80 -PU53,123,161,500,31347 --initial-rtt-timeout 250ms --max-rtt-timeout 1s --host-timeout 20s"


# ============================================================
# 02 · TCP PORT ENUMERATION
# ============================================================

# COMPLETE:
# Scan all TCP ports (1-65535).
# Three retries and a generous per-host limit provide
# better coverage of filtered or unreliable connections.
# Intended primarily for individual hosts and small networks.
"02 · Ports · TCP · Complete (all ports)" = "-v -T3 -n -sS -p- --open --max-retries 3 --initial-rtt-timeout 500ms --max-rtt-timeout 3s --host-timeout 15m"

# FAST:
# Scan the 1000 most common TCP ports.
# Suitable for normal enumeration and larger networks.
"02 · Ports · TCP · Fast (top 1000)" = "-v -T4 -n -sS --top-ports 1000 --open --max-retries 2 --initial-rtt-timeout 400ms --max-rtt-timeout 1500ms --host-timeout 4m"

# VERY FAST:
# Scan only the 100 most common TCP ports.
# Aggressive retry and timeout limits reduce delays caused
# by filtered or non-responsive ports.
"02 · Ports · TCP · Very fast (top 100)" = "-v -T4 -n -sS --top-ports 100 --open --max-retries 1 --initial-rtt-timeout 250ms --max-rtt-timeout 1s --host-timeout 90s"


# ============================================================
# 02 · UDP PORT ENUMERATION AND SERVICE DETECTION
# ============================================================

# COMPLETE:
# Scan all UDP ports and perform version detection.
# Version detection is particularly useful for UDP because
# many ports otherwise remain in the open|filtered state.
# The 30-minute host limit prevents extremely slow UDP hosts
# from blocking the scan indefinitely.
"02 · Ports · UDP · Complete (all ports)" = "-v -T3 -n -sUV -p- --version-all --open --max-retries 2 --initial-rtt-timeout 500ms --max-rtt-timeout 3s --max-scan-delay 2s --host-timeout 30m"

# FAST:
# Scan the 1000 most common UDP ports and identify services.
# More suitable for networks with several hundred hosts.
"02 · Ports · UDP · Fast (top 1000)" = "-v -T4 -n -sUV --top-ports 1000 --open --max-retries 2 --initial-rtt-timeout 400ms --max-rtt-timeout 1500ms --max-scan-delay 1s --host-timeout 10m"

# VERY FAST:
# Scan the 100 most common UDP ports.
# Uses light version detection, one retry and a shorter
# adaptive scan-delay ceiling to reduce waiting.
"02 · Ports · UDP · Very fast (top 100)" = "-v -T4 -n -sUV --version-light --top-ports 100 --open --max-retries 1 --initial-rtt-timeout 250ms --max-rtt-timeout 1s --max-scan-delay 500ms --host-timeout 3m"


# ============================================================
# 03 · TCP SERVICE AND VERSION DETECTION
# ============================================================

# COMPLETE:
# Recheck the TCP ports already discovered and attempt
# every available version-detection probe.
# Intensity 9 provides the broadest service identification.
"03 · Details · TCP · Complete (all version probes)" = "-v -T3 -n -sS -sV --version-all -p{ports} --open --max-retries 2 --initial-rtt-timeout 500ms --max-rtt-timeout 3s --host-timeout 10m"

# FAST:
# Uses the default Nmap version-detection intensity (7).
# Good general-purpose service identification.
"03 · Details · TCP · Fast (normal version detection)" = "-v -T4 -n -sS -sV -p{ports} --open --max-retries 2 --initial-rtt-timeout 400ms --max-rtt-timeout 1500ms --host-timeout 3m"

# VERY FAST:
# Uses version intensity 2, substantially reducing the
# number of probes while still identifying common services.
"03 · Details · TCP · Very fast (light version detection)" = "-v -T4 -n -sS -sV --version-light -p{ports} --open --max-retries 1 --initial-rtt-timeout 250ms --max-rtt-timeout 1s --host-timeout 90s"


# ============================================================
# 04 · VULNERABILITY ASSESSMENT
# ============================================================

# COMPLETE:
# Run the full Nmap vuln script category against known
# TCP ports, with comprehensive service version detection.
# Some scripts can be intrusive. Review their behavior
# before running this against production systems.
"04 · Vuln · Complete (all vuln scripts)" = "-v -T3 -n -sS -sV --version-all -p{ports} --script vuln --script-timeout 90s --max-retries 2 --max-rtt-timeout 3s --host-timeout 15m"

# FAST:
# Restricts the selection to scripts tagged as both vuln
# and safe. This avoids many of the more intrusive tests.
"04 · Vuln · Fast (safe vulnerability scripts)" = "-v -T4 -n -sS -sV -p{ports} --script 'vuln and safe' --script-timeout 30s --max-retries 1 --max-rtt-timeout 1500ms --host-timeout 5m"

# VERY FAST:
# Same conservative script selection as Fast, but uses
# light service detection and a shorter script timeout.
# Some slow vulnerability checks will be terminated.
"04 · Vuln · Very fast (short safe checks)" = "-v -T4 -n -sS -sV --version-light -p{ports} --script 'vuln and safe' --script-timeout 10s --max-retries 1 --max-rtt-timeout 1s --host-timeout 2m"


# ============================================================
# 04 · TARGETED SECURITY CHECKS
# ============================================================

# SMB SHARE ENUMERATION:
# Enumerate SMB shares using the specified credentials.
# The NSE argument names are smbusername and smbpassword.
# Replace the placeholders before executing this preset.
"04 · Vuln · SMB share enumeration" = "-v -T3 -n -sS -sV -p139,445 --script smb-enum-shares --script-args 'smbusername=USERNAME,smbpassword=PASSWORD' --script-timeout 30s --host-timeout 3m"

# SMB VULNERABILITY CHECKS:
# Run SMB-specific vulnerability scripts.
# Review the individual script behavior before execution.
"04 · Vuln · SMB vulnerability checks (139,445)" = "-v -T3 -n -sS -sV -p139,445 --script smb-vuln* --script-timeout 45s --host-timeout 5m"

# SSH CONFIGURATION:
# Enumerate SSH protocol versions, supported algorithms
# and host keys. These are configuration checks, not a
# comprehensive vulnerability assessment.
"04 · Audit · SSH configuration (22)" = "-v -T3 -n -sS -sV -p22 --script sshv1,ssh2-enum-algos,ssh-hostkey --script-timeout 30s --host-timeout 3m"

# HTTP VULNERABILITY CHECKS:
# Run HTTP-specific vulnerability scripts on common
# web ports. Some scripts actively test the service.
"04 · Vuln · HTTP vulnerability checks (80,443)" = "-v -T3 -n -sS -sV -p80,443 --script http-vuln* --script-timeout 60s --host-timeout 5m"


# ============================================================
# 05 · NAME AND SERVICE ENRICHMENT
# ============================================================

# COMPLETE:
# Collect certificate information, page titles, HTTP
# headers, RDP NTLM information, SMB OS information,
# LDAP root DSE and certificate internal-address details.
# Uses complete service version detection.
"05 · Names · Complete (all metadata scripts)" = "-v -T3 -n -sS -sV --version-all -p{ports} --script ssl-cert,http-title,http-headers,rdp-ntlm-info,smb-os-discovery,ldap-rootdse,ssl-cert-intaddr --script-timeout 60s --max-retries 2 --max-rtt-timeout 3s --host-timeout 12m"

# FAST:
# Uses normal service detection and the same core metadata
# scripts. Suitable for ordinary network enumeration.
"05 · Names · Fast (service metadata)" = "-v -T4 -n -sS -sV -p{ports} --script ssl-cert,http-title,http-headers,rdp-ntlm-info,smb-os-discovery,ldap-rootdse,ssl-cert-intaddr --script-timeout 30s --max-retries 1 --max-rtt-timeout 1500ms --host-timeout 4m"

# VERY FAST:
# Limits version detection and metadata script execution.
# Prioritizes certificates and common HTTP/RDP/SMB details.
"05 · Names · Very fast (selected metadata)" = "-v -T4 -n -sS -sV --version-light -p{ports} --script ssl-cert,http-title,rdp-ntlm-info,smb-os-discovery --script-timeout 10s --max-retries 1 --max-rtt-timeout 1s --host-timeout 2m"

# NETBIOS:
# Kept separate because nbstat uses UDP port 137.
# This avoids unnecessarily scanning the TCP port list
# again for a UDP-specific name-enumeration operation.
"05 · Names · NetBIOS enumeration (UDP 137)" = "-v -T4 -n -sU -sV -p137 --script nbstat --script-timeout 15s --host-timeout 2m"

# CERTIFICATE TRANSPARENCY:
# Query external certificate information via crt.sh.
# This is an enrichment operation, not a local service scan.
# Use selectively because external queries across thousands
# of hosts can be slow and may encounter rate limiting.
"05 · Names · External CT lookup (crt.sh)" = "-v -T3 -n -sS -sV -p{ports} --script hostmap-crtsh --script-timeout 60s --host-timeout 5m"

# HTTP VIRTUAL HOSTS:
# Attempts virtual-host discovery using common hostnames.
# This generates additional HTTP requests and is deliberately
# kept separate from the normal name-enumeration presets.
"05 · Names · HTTP virtual hosts (intrusive)" = "-v -T3 -n -sS -sV -p80,443,8080,8443 --script http-vhosts --script-timeout 45s --host-timeout 3m"


# ============================================================
# 06 · AUTHENTICATION CHECKS
# ============================================================

# COMPLETE:
# Run the Nmap auth script category against known ports.
# The broader selection may include intrusive checks.
"06 · Auth · Complete (authentication scripts)" = "-v -T3 -n -sS -sV -p{ports} --script auth --script-timeout 60s --max-retries 2 --host-timeout 10m"

# FAST:
# Restrict selection to scripts categorized as both auth
# and safe. Suitable for less intrusive checks.
"06 · Auth · Fast (safe authentication scripts)" = "-v -T4 -n -sS -sV -p{ports} --script 'auth and safe' --script-timeout 30s --max-retries 1 --host-timeout 4m"

# VERY FAST:
# Uses the safe authentication subset with a short
# per-script and per-host time limit.
"06 · Auth · Very fast (short safe checks)" = "-v -T4 -n -sS -sV --version-light -p{ports} --script 'auth and safe' --script-timeout 10s --max-retries 1 --host-timeout 2m"

# BRUTE FORCE:
# Explicitly opt-in operation. Kept separate from the normal
# speed profiles because password-guessing activity can
# cause account lockouts and service disruption.
# Use only with a specifically authorized target and
# an approved account-testing policy.
"06 · Creds · Brute force logins (manual opt-in)" = "-v -T3 -n -sS -sV -p{ports} --script brute --script-timeout 15s --max-retries 1 --host-timeout 3m"


