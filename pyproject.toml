[project]
name = "seek-tui"
version = "0.3.2"
description = "Interactive terminal search for files, directories, and file contents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "textual>=0.79",
    "pyperclip>=1.9",
]

[project.scripts]
seek = "seek.cli:main"

[project.optional-dependencies]
gitignore = ["pathspec>=0.12"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pathspec>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seek"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
